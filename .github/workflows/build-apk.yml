      - name: Build APK
        run: |
          SETTINGS=$(find source \( -name settings.gradle -o -name settings.gradle.kts \) | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "No se encontró el proyecto Gradle"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")
          cd "$PROJECT_DIR"

          gradle --no-daemon assembleDebug

          APK=$(find . -path '*/build/outputs/apk/debug/*.apk' -type f | head -n 1)

          if [ -z "$APK" ]; then
            echo "No se encontró el APK"
            exit 1
          fi

          APK_PATH="$PWD/${APK#./}"
          echo "APK_PATH=$APK_PATH" >> "$GITHUB_ENV"
          echo "APK encontrado: $APK_PATH"
          
